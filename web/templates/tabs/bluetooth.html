<div class="content-section">
    <h2>État de la connexion</h2>
    <p id="bt-status"><strong>Appareil connecté :</strong> <span id="bt-connected-device">Aucun</span></p>
    <button id="bt-disconnect-btn" class="btn" style="display:none;">Se déconnecter</button>
</div>
<div class="content-section">
    <h2>Flux vidéo de traduction</h2>
    <div id="video-container" style="width: 100%; max-width: 640px; border-radius: 8px; overflow: hidden; display: none;">
        <img id="video-stream" src="" alt="Flux vidéo" style="width: 100%; display: block;">
    </div>
    <p id="video-placeholder" style="text-align: center; color: #666; padding: 40px;">Le flux vidéo apparaîtra ici après le démarrage de la traduction</p>
</div>
<div class="content-section">
    <h2>Appareils disponibles</h2>
    <button id="bt-scan-btn" class="btn primary">Scanner les appareils</button>
    <ul id="bt-devices-list"></ul>
</div>
<div class="content-section">
    <h2>Contrôle de la traduction</h2>
    <p id="translation-status"><strong>État :</strong> Inactif</p>
    <button id="translation-start-btn" class="btn" disabled>Démarrer</button>
    <button id="translation-stop-btn" class="btn" disabled>Arrêter</button>
</div>
